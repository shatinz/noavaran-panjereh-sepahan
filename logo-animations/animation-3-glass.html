<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوآوران پنجره سپاهان — انیمیشن ۳: هولوگرافی سه‌بعدی و شیشه دوجداره</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brand-red: #9B2130;
    --brand-blue: #00AFEF;
    --brand-ice: #96DAF8;
    --brand-dark: #07080c;
  }

  body {
    background: radial-gradient(circle at 50% 40%, #10141e 0%, #08090d 60%, #030406 100%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    user-select: none;
    perspective: 1400px;
  }

  /* Deep Space Lighting & Orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    opacity: 0.35;
    animation: orbPulse 8s ease-in-out infinite alternate;
  }

  .orb-cyan {
    width: 450px;
    height: 450px;
    background: var(--brand-blue);
    top: 10%;
    left: 15%;
  }

  .orb-crimson {
    width: 400px;
    height: 400px;
    background: var(--brand-red);
    bottom: 10%;
    right: 15%;
    animation-delay: -4s;
  }

  @keyframes orbPulse {
    0% { transform: scale(0.9) translate(-20px, 10px); opacity: 0.25; }
    100% { transform: scale(1.15) translate(20px, -10px); opacity: 0.45; }
  }

  /* 3D Scene Wrapper */
  .scene-3d {
    position: relative;
    width: 620px;
    height: 620px;
    max-width: 90vw;
    max-height: 90vw;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    cursor: grab;
    z-index: 10;
  }

  .scene-3d:active {
    cursor: grabbing;
  }

  /* 3D Glass Plaque */
  .glass-slab {
    position: relative;
    width: 480px;
    height: 480px;
    max-width: 82vw;
    max-height: 82vw;
    border-radius: 40px;
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.08) 0%,
      rgba(255, 255, 255, 0.02) 40%,
      rgba(0, 175, 239, 0.04) 100%
    );
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    box-shadow: 
      0 30px 60px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.3),
      inset 0 -1px 0 rgba(0, 175, 239, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    transform: rotateX(12deg) rotateY(-18deg) translateZ(0);
    transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
    animation: slabEntrance 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slabEntrance {
    0% {
      opacity: 0;
      transform: rotateX(45deg) rotateY(-60deg) translateZ(-400px) scale(0.6);
      filter: blur(15px);
    }
    60% {
      opacity: 1;
      transform: rotateX(-5deg) rotateY(10deg) translateZ(50px) scale(1.02);
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: rotateX(0deg) rotateY(0deg) translateZ(0) scale(1);
    }
  }

  /* Hologram Orbit Rings (Tilting in 3D) */
  .orbit-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0, 175, 239, 0.35);
    pointer-events: none;
    transform-style: preserve-3d;
  }

  .orbit-ring-1 {
    width: 530px;
    height: 530px;
    border-top: 2px solid #00AFEF;
    border-bottom: 2px solid transparent;
    animation: ringOrbit1 16s linear infinite;
  }

  .orbit-ring-2 {
    width: 560px;
    height: 560px;
    border-left: 2px solid #9B2130;
    border-right: 2px solid transparent;
    animation: ringOrbit2 22s linear infinite;
  }

  @keyframes ringOrbit1 {
    0% { transform: rotateX(65deg) rotateZ(0deg); }
    100% { transform: rotateX(65deg) rotateZ(360deg); }
  }

  @keyframes ringOrbit2 {
    0% { transform: rotateY(65deg) rotateZ(360deg); }
    100% { transform: rotateY(65deg) rotateZ(0deg); }
  }

  /* Floating Logo Container (Elevated Above Glass) */
  .logo-float-layer {
    position: relative;
    width: 380px;
    height: 380px;
    max-width: 70vw;
    max-height: 70vw;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    transform: translateZ(55px);
  }

  /* Deep Cast Shadow On Glass Surface */
  .logo-shadow {
    position: absolute;
    width: 90%;
    height: 90%;
    object-fit: contain;
    filter: brightness(0) blur(18px);
    opacity: 0.65;
    transform: translateZ(-35px) translateY(18px) scale(0.96);
    pointer-events: none;
  }

  /* The EXACT Authentic Website Logo (In 3D Floating Relief) */
  .logo-3d-authentic {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 10;
    filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.65));
    transform: translateZ(25px);
    animation: logoGleamPop 1.6s 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }

  @keyframes logoGleamPop {
    0% {
      opacity: 0;
      transform: translateZ(80px) scale(0.85);
      filter: brightness(2) drop-shadow(0 0 40px #00AFEF);
    }
    100% {
      opacity: 1;
      transform: translateZ(25px) scale(1);
      filter: brightness(1) drop-shadow(0 15px 30px rgba(0, 0, 0, 0.65));
    }
  }

  /* Sweeping Prismatic Caustic Beam */
  .prismatic-beam {
    position: absolute;
    inset: -30%;
    background: linear-gradient(
      120deg,
      transparent 35%,
      rgba(0, 175, 239, 0.12) 42%,
      rgba(255, 255, 255, 0.75) 48%,
      rgba(155, 33, 48, 0.25) 54%,
      transparent 65%
    );
    z-index: 25;
    pointer-events: none;
    transform: translateX(-150%) translateZ(40px);
    animation: causticPass 4s 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    opacity: 0;
  }

  @keyframes causticPass {
    0% {
      transform: translateX(-150%) translateZ(40px);
      opacity: 0;
    }
    20% {
      opacity: 1;
    }
    60% {
      transform: translateX(150%) translateZ(40px);
      opacity: 0;
    }
    100% {
      transform: translateX(150%) translateZ(40px);
      opacity: 0;
    }
  }

  /* Ripple Shockwave On Click */
  .click-ripple {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #00AFEF;
    box-shadow: 0 0 20px #00AFEF;
    pointer-events: none;
    z-index: 50;
    transform: translate(-50%, -50%) translateZ(60px) scale(0);
    opacity: 1;
    transition: transform 0.8s ease-out, opacity 0.8s ease-out;
  }

  /* Header Title */
  .title-pill {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16, 20, 30, 0.88);
    border: 1px solid rgba(0, 175, 239, 0.4);
    backdrop-filter: blur(14px);
    padding: 6px 20px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: bold;
    color: #ffffff;
    z-index: 30;
    box-shadow: 0 4px 20px rgba(0, 175, 239, 0.2);
  }

  .title-pill span.pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00AFEF;
    box-shadow: 0 0 10px #00AFEF;
  }

  /* Bottom Controls */
  .controls-panel {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(16, 20, 30, 0.85);
    border: 1px solid rgba(0, 175, 239, 0.35);
    backdrop-filter: blur(16px);
    padding: 8px 18px;
    border-radius: 9999px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    z-index: 30;
  }

  .ctrl-btn {
    background: transparent;
    border: 1px solid rgba(0, 175, 239, 0.35);
    color: #f1f5f9;
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .ctrl-btn:hover {
    background: rgba(0, 175, 239, 0.25);
    border-color: #00AFEF;
    color: #ffffff;
    box-shadow: 0 0 14px rgba(0, 175, 239, 0.5);
  }

  .ctrl-btn.active {
    background: #00AFEF;
    color: #07090e;
    font-weight: bold;
    border-color: #00AFEF;
  }

  .gyro-tip {
    position: fixed;
    bottom: 75px;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(150, 218, 248, 0.5);
    text-align: center;
    z-index: 25;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- Ambient Light Orbs -->
  <div class="orb orb-cyan"></div>
  <div class="orb orb-crimson"></div>

  <!-- Header Title -->
  <div class="title-pill">
    <span class="pulse-dot"></span>
    لوگو موشن ۰۳: هولوگرافی سه‌بعدی و شیشه دوجداره (3D Holographic Curtain-Wall)
  </div>

  <!-- 3D Interactive Scene -->
  <div class="scene-3d" id="scene3d">
    
    <!-- Holographic 3D Orbit Rings -->
    <div class="orbit-ring orbit-ring-1"></div>
    <div class="orbit-ring orbit-ring-2"></div>

    <!-- Chamfered 3D Glass Slab -->
    <div class="glass-slab" id="glassSlab">
      
      <!-- Elevated Floating Logo Layer with Shadow -->
      <div class="logo-float-layer">
        <!-- Cast Ambient Shadow Underneath -->
        <img src="../images/logo.png" alt="سایه لوگو" class="logo-shadow" id="shadowLogo" />

        <!-- The EXACT Authentic Website Logo Suspended in 3D -->
        <img src="../images/logo.png" alt="شرکت نوآوران پنجره سپاهان" class="logo-3d-authentic" id="authenticLogo" />

        <!-- Caustic Prismatic Glass Gleam -->
        <div class="prismatic-beam"></div>
      </div>

    </div>

  </div>

  <div class="gyro-tip">💡 ماوس را روی تصویر حرکت دهید تا ژیروسکوپ سه‌بعدی و انعکاس شیشه را مشاهده کنید (یا کلیک کنید)</div>

  <!-- Control Panel -->
  <div class="controls-panel">
    <button class="ctrl-btn active" id="btnReplay" onclick="restartAnimation()">
      <span>↻</span> اجرای مجدد
    </button>
    <button class="ctrl-btn" id="btnAutoSpin" onclick="toggleAutoSpin()">
      حالت چرخش پیوسته ۳۶۰°
    </button>
    <button class="ctrl-btn" id="btnWhite" onclick="toggleWhiteLogo()">
      نسخه متالیک نقره‌ای
    </button>
  </div>

  <script>
    const scene = document.getElementById('scene3d');
    const slab = document.getElementById('glassSlab');
    let isWhite = false;
    let autoSpin = false;
    let spinAngle = 0;
    let spinReq = null;

    // Interactive 3D Mouse Parallax
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    window.addEventListener('mousemove', (e) => {
      if (autoSpin) return;
      const rect = scene.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
      const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);

      targetY = deltaX * 24;  // Rotate around Y axis
      targetX = -deltaY * 20; // Rotate around X axis
    });

    window.addEventListener('mouseleave', () => {
      if (!autoSpin) {
        targetX = 0;
        targetY = 0;
      }
    });

    function updateParallax() {
      if (!autoSpin) {
        currentX += (targetX - currentX) * 0.1;
        currentY += (targetY - currentY) * 0.1;
        slab.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
      }
      requestAnimationFrame(updateParallax);
    }
    updateParallax();

    // Click Ripple Effect
    scene.addEventListener('click', (e) => {
      const rect = scene.getBoundingClientRect();
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX - rect.left}px`;
      ripple.style.top = `${e.clientY - rect.top}px`;
      scene.appendChild(ripple);

      requestAnimationFrame(() => {
        ripple.style.transform = `translate(-50%, -50%) translateZ(80px) scale(20)`;
        ripple.style.opacity = '0';
      });

      setTimeout(() => {
        ripple.remove();
      }, 800);
    });

    function restartAnimation() {
      slab.style.animation = 'none';
      const logo = document.getElementById('authenticLogo');
      logo.style.animation = 'none';
      
      void slab.offsetWidth; // Force reflow
      
      slab.style.animation = 'slabEntrance 2s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      logo.style.animation = 'logoGleamPop 1.6s 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards';
    }

    function toggleAutoSpin() {
      autoSpin = !autoSpin;
      const btn = document.getElementById('btnAutoSpin');
      btn.classList.toggle('active', autoSpin);

      if (autoSpin) {
        spinLoop();
      } else {
        cancelAnimationFrame(spinReq);
        targetX = 0;
        targetY = 0;
      }
    }

    function spinLoop() {
      if (!autoSpin) return;
      spinAngle = (spinAngle + 0.8) % 360;
      slab.style.transform = `rotateX(8deg) rotateY(${spinAngle}deg)`;
      spinReq = requestAnimationFrame(spinLoop);
    }

    function toggleWhiteLogo() {
      isWhite = !isWhite;
      const imgs = document.querySelectorAll('#authenticLogo, #shadowLogo');
      imgs.forEach(img => {
        img.src = isWhite ? '../images/logo-white.png' : '../images/logo.png';
      });
      document.getElementById('btnWhite').classList.toggle('active', isWhite);
    }
  </script>
</body>
</html>
