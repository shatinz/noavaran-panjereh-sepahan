name: CI

on:
  push:
    branches-ignore: [redblack]   # redblack is built + deployed by deploy-server.yml
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Project
        run: pnpm run build
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'change-me-ci-only' }}
          ADMIN_SESSION_SECRET: ci-build-only-secret-not-used-in-production
