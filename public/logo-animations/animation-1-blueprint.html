<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوآوران پنجره سپاهان — Blueprint Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  .container {
    position: relative;
    width: 600px;
    height: 600px;
  }

  /* Grid background */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,175,239,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,175,239,0.06) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: gridFadeIn 1.5s ease-out forwards;
    opacity: 0;
  }

  @keyframes gridFadeIn {
    to { opacity: 1; }
  }

  /* SVG canvas */
  svg.logo-svg {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 2;
  }

  /* Stroke drawing animation */
  .draw-path {
    fill: none;
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: drawLine var(--dur) var(--delay) ease-out forwards;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  /* Fill fade-in */
  .fill-fade {
    opacity: 0;
    animation: fadeIn 0.8s var(--delay) ease-out forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Glow pulse on drawn elements */
  .glow-pulse {
    filter: drop-shadow(0 0 0px rgba(0,175,239,0));
    animation: glowAnim 2s var(--delay) ease-in-out infinite;
  }

  @keyframes glowAnim {
    0%, 100% { filter: drop-shadow(0 0 2px rgba(0,175,239,0.3)); }
    50% { filter: drop-shadow(0 0 12px rgba(0,175,239,0.8)); }
  }

  /* Circle border drawing */
  .circle-draw {
    fill: none;
    stroke: #00AFEF;
    stroke-width: 3;
    stroke-dasharray: 1508;
    stroke-dashoffset: 1508;
    animation: drawCircle 2s 0.3s ease-out forwards;
  }

  @keyframes drawCircle {
    to { stroke-dashoffset: 0; }
  }

  /* Inner circle */
  .circle-inner {
    fill: none;
    stroke: rgba(0,175,239,0.3);
    stroke-width: 1;
    stroke-dasharray: 1382;
    stroke-dashoffset: 1382;
    animation: drawCircle 1.8s 0.6s ease-out forwards;
  }

  /* Building lines group */
  .building-line {
    stroke: #00AFEF;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* N letter */
  .letter-n {
    stroke: #9B2130;
    stroke-width: 3;
    fill: none;
  }

  /* P letter */
  .letter-p {
    stroke: #FEFEFE;
    stroke-width: 2.5;
    fill: none;
  }

  /* S letter */
  .letter-s {
    stroke: #9B2130;
    stroke-width: 3;
    fill: none;
  }

  /* Window glass */
  .glass-rect {
    fill: none;
    stroke: #96DAF8;
    stroke-width: 1.5;
  }

  .glass-fill {
    fill: rgba(150,218,248,0.15);
    opacity: 0;
    animation: glassFill 1s var(--delay) ease-out forwards;
  }

  @keyframes glassFill {
    to { opacity: 1; }
  }

  /* Text reveal */
  .brand-text {
    opacity: 0;
    animation: textReveal 1s var(--delay) ease-out forwards;
  }

  @keyframes textReveal {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Scanning line */
  .scan-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00AFEF, transparent);
    z-index: 10;
    animation: scanDown 3s 0.5s ease-in-out forwards;
    opacity: 0;
  }

  @keyframes scanDown {
    0% { top: 5%; opacity: 0; }
    5% { opacity: 0.8; }
    95% { opacity: 0.8; }
    100% { top: 95%; opacity: 0; }
  }

  /* Corner markers */
  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: #00AFEF;
    opacity: 0;
    animation: cornerIn 0.5s 0.2s ease-out forwards;
  }

  @keyframes cornerIn {
    to { opacity: 0.6; }
  }

  .corner-tl { top: 30px; left: 30px; border-top: 2px solid; border-left: 2px solid; }
  .corner-tr { top: 30px; right: 30px; border-top: 2px solid; border-right: 2px solid; }
  .corner-bl { bottom: 30px; left: 30px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner-br { bottom: 30px; right: 30px; border-bottom: 2px solid; border-right: 2px solid; }

  /* Particles */
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #00AFEF;
    border-radius: 50%;
    opacity: 0;
    animation: particleFloat 4s var(--delay) ease-in-out infinite;
  }

  @keyframes particleFloat {
    0% { opacity: 0; transform: translate(0, 0) scale(0); }
    20% { opacity: 0.8; transform: translate(var(--tx), var(--ty)) scale(1); }
    80% { opacity: 0.4; }
    100% { opacity: 0; transform: translate(calc(var(--tx) * 2), calc(var(--ty) * 2)) scale(0); }
  }

  /* Replay button */
  .replay-btn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,175,239,0.15);
    border: 1px solid rgba(0,175,239,0.4);
    color: #00AFEF;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
    z-index: 20;
    opacity: 0;
    animation: fadeIn 0.5s 5s ease-out forwards;
  }

  .replay-btn:hover {
    background: rgba(0,175,239,0.3);
    border-color: #00AFEF;
  }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(0,175,239,0.3);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 0.5s 5.5s ease-out forwards;
  }
</style>
</head>
<body>

<div class="container">
  <div class="grid-bg"></div>
  <div class="scan-line"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Floating particles -->
  <div class="particle" style="left:15%;top:20%;--tx:10px;--ty:-20px;--delay:1s"></div>
  <div class="particle" style="left:80%;top:30%;--tx:-15px;--ty:10px;--delay:1.5s"></div>
  <div class="particle" style="left:25%;top:75%;--tx:20px;--ty:-10px;--delay:2s"></div>
  <div class="particle" style="left:70%;top:80%;--tx:-10px;--ty:-15px;--delay:2.5s"></div>
  <div class="particle" style="left:50%;top:15%;--tx:5px;--ty:15px;--delay:3s"></div>
  <div class="particle" style="left:40%;top:60%;--tx:-12px;--ty:8px;--delay:1.8s"></div>

  <svg class="logo-svg" viewBox="0 0 500 500">
    <!-- Outer circle -->
    <circle cx="250" cy="250" r="240" class="circle-draw" />
    <circle cx="250" cy="220" r="220" class="circle-inner" />

    <!-- Building structure - left wing -->
    <line x1="140" y1="350" x2="140" y2="180" class="building-line draw-path glow-pulse"
      style="--len:170;--dur:0.8s;--delay:1.2s" />
    <line x1="140" y1="180" x2="200" y2="145" class="building-line draw-path glow-pulse"
      style="--len:75;--dur:0.5s;--delay:1.6s" />
    <line x1="200" y1="145" x2="250" y2="120" class="building-line draw-path glow-pulse"
      style="--len:55;--dur:0.4s;--delay:1.8s" />

    <!-- Building structure - right wing -->
    <line x1="360" y1="350" x2="360" y2="180" class="building-line draw-path glow-pulse"
      style="--len:170;--dur:0.8s;--delay:1.3s" />
    <line x1="360" y1="180" x2="300" y2="145" class="building-line draw-path glow-pulse"
      style="--len:75;--dur:0.5s;--delay:1.7s" />
    <line x1="300" y1="145" x2="250" y2="120" class="building-line draw-path glow-pulse"
      style="--len:55;--dur:0.4s;--delay:1.9s" />

    <!-- Roof lines -->
    <line x1="120" y1="310" x2="250" y2="240" class="building-line draw-path"
      style="--len:150;--dur:0.6s;--delay:2.0s;stroke:#9B2130;stroke-width:2.5" />
    <line x1="380" y1="310" x2="250" y2="240" class="building-line draw-path"
      style="--len:150;--dur:0.6s;--delay:2.1s;stroke:#9B2130;stroke-width:2.5" />

    <!-- Secondary roof -->
    <line x1="150" y1="290" x2="250" y2="220" class="building-line draw-path"
      style="--len:120;--dur:0.5s;--delay:2.3s;stroke:#9B2130;stroke-width:1.5;opacity:0.6" />
    <line x1="350" y1="290" x2="250" y2="220" class="building-line draw-path"
      style="--len:120;--dur:0.5s;--delay:2.4s;stroke:#9B2130;stroke-width:1.5;opacity:0.6" />

    <!-- Floor line -->
    <line x1="140" y1="350" x2="360" y2="350" class="building-line draw-path"
      style="--len:220;--dur:0.6s;--delay:2.5s;stroke:#FEFEFE;stroke-width:1.5" />

    <!-- Window center -->
    <rect x="230" y="240" width="40" height="80" rx="2"
      class="glass-rect draw-path" style="--len:240;--dur:0.8s;--delay:2.6s" />
    <rect x="232" y="242" width="36" height="76" rx="1"
      class="glass-fill" style="--delay:3.0s" />

    <!-- Window left -->
    <rect x="180" y="260" width="30" height="55" rx="2"
      class="glass-rect draw-path" style="--len:170;--dur:0.6s;--delay:2.8s" />
    <rect x="182" y="262" width="26" height="51" rx="1"
      class="glass-fill" style="--delay:3.2s" />

    <!-- Window right -->
    <rect x="290" y="260" width="30" height="55" rx="2"
      class="glass-rect draw-path" style="--len:170;--dur:0.6s;--delay:2.9s" />
    <rect x="292" y="262" width="26" height="51" rx="1"
      class="glass-fill" style="--delay:3.3s" />

    <!-- N Letter -->
    <path d="M155 370 L155 335 L190 370 L190 335"
      class="letter-n draw-path" style="--len:120;--dur:0.7s;--delay:3.2s" />

    <!-- P Letter -->
    <path d="M215 370 L215 335 L235 335 Q245 335 245 345 Q245 355 235 355 L215 355"
      class="letter-p draw-path" style="--len:90;--dur:0.7s;--delay:3.4s" />

    <!-- S Letter -->
    <path d="M340 340 Q325 335 310 340 Q295 345 310 355 Q325 365 310 370 Q295 375 280 370"
      class="letter-s draw-path" style="--len:100;--dur:0.7s;--delay:3.6s" />

    <!-- Company name Persian -->
    <text x="250" y="80" text-anchor="middle" font-size="16"
      fill="#FEFEFE" font-family="Tahoma, Arial" class="brand-text" style="--delay:4.0s">
      شرکت نوآوران پنجره سپاهان
    </text>

    <!-- Company name English -->
    <text x="250" y="440" text-anchor="middle" font-size="13"
      fill="#00AFEF" font-family="'Segoe UI', Arial" letter-spacing="2" class="brand-text" style="--delay:4.2s">
      NOAVARAN PANJEREH SEPAHAN
    </text>

    <!-- Website -->
    <text x="250" y="465" text-anchor="middle" font-size="10"
      fill="rgba(254,254,254,0.4)" font-family="'Segoe UI', Arial" letter-spacing="1" class="brand-text" style="--delay:4.5s">
      www.NoavaranPanjereh.com
    </text>

    <!-- Registration -->
    <text x="250" y="395" text-anchor="middle" font-size="9"
      fill="rgba(254,254,254,0.35)" font-family="Tahoma, Arial" class="brand-text" style="--delay:4.3s">
      سهامی خاص — شماره ثبت: ۳۸۹۲
    </text>

    <!-- Crosshair center mark -->
    <line x1="245" y1="250" x2="255" y2="250" stroke="rgba(0,175,239,0.3)" stroke-width="0.5"
      class="fill-fade" style="--delay:1s" />
    <line x1="250" y1="245" x2="250" y2="255" stroke="rgba(0,175,239,0.3)" stroke-width="0.5"
      class="fill-fade" style="--delay:1s" />
  </svg>
</div>

<div class="watermark">BLUEPRINT REVEAL — ANIMATION 01</div>
<button class="replay-btn" onclick="location.reload()">↻ Replay Animation</button>

</body>
</html>
