<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوآوران پنجره سپاهان — Glass Morph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0e 50%, #0a0a1a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 700px;
    height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
  }

  /* Ambient light orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    animation: orbFloat 6s ease-in-out infinite;
    opacity: 0;
  }

  .orb-1 {
    width: 300px; height: 300px;
    background: rgba(155,33,48,0.2);
    top: 10%; left: 5%;
    animation-delay: 0s;
  }

  .orb-2 {
    width: 250px; height: 250px;
    background: rgba(0,175,239,0.15);
    bottom: 15%; right: 10%;
    animation-delay: 2s;
  }

  .orb-3 {
    width: 200px; height: 200px;
    background: rgba(155,33,48,0.1);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: 4s;
  }

  @keyframes orbFloat {
    0%, 100% { opacity: 0.4; transform: translate(0, 0) scale(1); }
    33% { opacity: 0.7; transform: translate(20px, -15px) scale(1.1); }
    66% { opacity: 0.5; transform: translate(-15px, 10px) scale(0.95); }
  }

  /* 3D rotating card */
  .card-3d {
    width: 480px;
    height: 480px;
    position: relative;
    z-index: 3;
    transform-style: preserve-3d;
    animation: cardEntry 2s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: rotateY(90deg) scale(0.5);
  }

  @keyframes cardEntry {
    0% { opacity: 0; transform: rotateY(90deg) scale(0.5); }
    60% { opacity: 1; transform: rotateY(-5deg) scale(1.02); }
    100% { opacity: 1; transform: rotateY(0deg) scale(1); }
  }

  /* Subtle continuous float */
  .card-3d.loaded {
    animation: gentleFloat 6s ease-in-out infinite;
  }

  @keyframes gentleFloat {
    0%, 100% { transform: rotateY(0deg) rotateX(0deg); }
    25% { transform: rotateY(2deg) rotateX(1deg); }
    50% { transform: rotateY(-1deg) rotateX(-0.5deg); }
    75% { transform: rotateY(1.5deg) rotateX(0.5deg); }
  }

  /* Glass card surface */
  .glass-card {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 0 60px rgba(155,33,48,0.1),
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 25px 50px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Moving shine streak across card */
  .glass-card::before {
    content: '';
    position: absolute;
    top: -100%;
    left: -100%;
    width: 60%;
    height: 300%;
    background: linear-gradient(
      115deg,
      transparent 40%,
      rgba(255,255,255,0.05) 45%,
      rgba(255,255,255,0.12) 50%,
      rgba(255,255,255,0.05) 55%,
      transparent 60%
    );
    animation: shinePass 4s 3s ease-in-out forwards;
    pointer-events: none;
  }

  @keyframes shinePass {
    0% { transform: translateX(0) rotate(0deg); }
    100% { transform: translateX(400%) rotate(0deg); }
  }

  /* Logo SVG inside card */
  .logo-inner {
    width: 320px;
    height: 320px;
    position: relative;
  }

  svg.main-logo {
    width: 100%;
    height: 100%;
  }

  /* Piece-by-piece assembly */
  .piece {
    opacity: 0;
    transform: translateY(30px) scale(0.8);
    animation: pieceIn 0.8s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes pieceIn {
    0% { opacity: 0; transform: translateY(30px) scale(0.8); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* Text animations */
  .text-slide {
    opacity: 0;
    animation: textSlide 0.8s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes textSlide {
    0% { opacity: 0; transform: translateY(15px); letter-spacing: 6px; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: var(--ls, 0); }
  }

  /* Outer ring rotation */
  .rotating-ring {
    position: absolute;
    width: 440px;
    height: 440px;
    border-radius: 50%;
    border: 1px solid rgba(155,33,48,0.15);
    border-top-color: rgba(155,33,48,0.5);
    animation: ringRotate 12s linear infinite;
    opacity: 0;
  }

  .rotating-ring.active {
    animation: ringAppear 1s 2s ease-out forwards, ringRotate 12s 3s linear infinite;
  }

  @keyframes ringAppear {
    to { opacity: 0.6; }
  }

  @keyframes ringRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .rotating-ring-2 {
    position: absolute;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    border: 1px dashed rgba(0,175,239,0.08);
    animation: ringRotateReverse 20s linear infinite;
    opacity: 0;
  }

  .rotating-ring-2.active {
    animation: ringAppear 1s 2.5s ease-out forwards, ringRotateReverse 20s 3.5s linear infinite;
  }

  @keyframes ringRotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  /* Persian name curved at top */
  .brand-persian {
    color: #FEFEFE;
    font-size: 20px;
    font-family: Tahoma, Arial;
    font-weight: bold;
    margin-bottom: 10px;
    opacity: 0;
    animation: textSlide 1s 3.5s ease-out forwards;
  }

  .brand-english {
    color: rgba(155,33,48,0.8);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0;
    animation: textSlide 1s 3.8s ease-out forwards;
  }

  .brand-reg {
    color: rgba(254,254,254,0.2);
    font-size: 9px;
    margin-top: 4px;
    opacity: 0;
    animation: textSlide 0.8s 4.1s ease-out forwards;
  }

  .brand-url {
    color: rgba(0,175,239,0.4);
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 12px;
    opacity: 0;
    animation: textSlide 0.8s 4.4s ease-out forwards;
  }

  /* NPS large letters below logo */
  .nps-letters {
    display: flex;
    gap: 20px;
    margin-top: 5px;
  }

  .nps-letter {
    font-size: 28px;
    font-weight: 900;
    font-family: 'Segoe UI', Arial;
    opacity: 0;
    background: linear-gradient(180deg, #ddd 0%, #666 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .nps-letter:nth-child(1) { animation: letterPop 0.6s 3.0s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .nps-letter:nth-child(2) { animation: letterPop 0.6s 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .nps-letter:nth-child(3) { animation: letterPop 0.6s 3.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

  @keyframes letterPop {
    0% { opacity: 0; transform: scale(0) rotateZ(-15deg); }
    100% { opacity: 1; transform: scale(1) rotateZ(0); }
  }

  /* Bottom label */
  .tag {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(254,254,254,0.15);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 0.5s 5s ease-out forwards;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .replay-btn {
    position: fixed;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
    z-index: 20;
    opacity: 0;
    animation: fadeIn 0.5s 5s ease-out forwards;
  }

  .replay-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    color: #fff;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="rotating-ring active"></div>
  <div class="rotating-ring-2 active"></div>

  <div class="card-3d" id="card3d">
    <div class="glass-card">

      <div class="brand-persian">نوآوران پنجره سپاهان</div>

      <div class="logo-inner">
        <svg class="main-logo" viewBox="0 0 400 400">
          <defs>
            <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#9B2130"/>
              <stop offset="100%" style="stop-color:#492E2D"/>
            </linearGradient>
            <linearGradient id="rGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#9B2130"/>
              <stop offset="100%" style="stop-color:#282829"/>
            </linearGradient>
            <linearGradient id="bGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#96DAF8"/>
              <stop offset="100%" style="stop-color:#00AFEF"/>
            </linearGradient>
            <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#bbb"/>
              <stop offset="100%" style="stop-color:#444"/>
            </linearGradient>
          </defs>

          <!-- Circle base -->
          <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(155,33,48,0.3)" stroke-width="2"
            class="piece" style="--delay:1.5s"/>

          <!-- Left building face -->
          <polygon points="80,310 80,140 160,100 200,80 200,310"
            fill="url(#rGrad2)" class="piece" style="--delay:1.8s"/>

          <!-- Right building face -->
          <polygon points="320,310 320,140 240,100 200,80 200,310"
            fill="url(#rGrad)" opacity="0.85" class="piece" style="--delay:2.0s"/>

          <!-- Roof accent lines -->
          <line x1="200" y1="80" x2="60" y2="170" stroke="#9B2130" stroke-width="2.5"
            opacity="0.7" class="piece" style="--delay:2.2s"/>
          <line x1="200" y1="80" x2="340" y2="170" stroke="#9B2130" stroke-width="2.5"
            opacity="0.7" class="piece" style="--delay:2.3s"/>

          <!-- Floor -->
          <rect x="70" y="305" width="260" height="6" rx="1"
            fill="url(#sGrad)" opacity="0.5" class="piece" style="--delay:2.4s"/>

          <!-- Central window -->
          <g class="piece" style="--delay:2.5s">
            <rect x="178" y="155" width="44" height="120" rx="4"
              fill="#111" stroke="#555" stroke-width="1"/>
            <rect x="182" y="159" width="36" height="112" rx="3"
              fill="url(#bGrad)" opacity="0.75"/>
            <!-- Glass shine -->
            <rect x="186" y="162" width="10" height="80" rx="5"
              fill="rgba(255,255,255,0.15)" transform="rotate(5,191,202)"/>
          </g>

          <!-- Left window -->
          <g class="piece" style="--delay:2.6s">
            <rect x="110" y="190" width="38" height="80" rx="3"
              fill="#111" stroke="#555" stroke-width="1"/>
            <rect x="113" y="193" width="32" height="74" rx="2"
              fill="url(#bGrad)" opacity="0.55"/>
          </g>

          <!-- Right window -->
          <g class="piece" style="--delay:2.7s">
            <rect x="252" y="190" width="38" height="80" rx="3"
              fill="#111" stroke="#555" stroke-width="1"/>
            <rect x="255" y="193" width="32" height="74" rx="2"
              fill="url(#bGrad)" opacity="0.55"/>
          </g>

          <!-- Small decorative windows -->
          <rect x="132" y="130" width="18" height="35" rx="2"
            fill="rgba(150,218,248,0.2)" class="piece" style="--delay:2.8s"/>
          <rect x="250" y="130" width="18" height="35" rx="2"
            fill="rgba(150,218,248,0.2)" class="piece" style="--delay:2.85s"/>
        </svg>
      </div>

      <div class="nps-letters">
        <span class="nps-letter">N</span>
        <span class="nps-letter" style="background:linear-gradient(180deg,#fff 0%,#9B2130 100%);-webkit-background-clip:text;background-clip:text;">P</span>
        <span class="nps-letter">S</span>
      </div>

      <div class="brand-english">Noavaran Panjereh Sepahan</div>
      <div class="brand-reg">سهامی خاص — شماره ثبت: ۳۸۹۲</div>
      <div class="brand-url">www.NoavaranPanjereh.com</div>
    </div>
  </div>
</div>

<button class="replay-btn" onclick="location.reload()">↻ Replay Animation</button>
<div class="tag">GLASS MORPH — ANIMATION 03</div>

<script>
  // After card entry animation, switch to gentle float
  const card = document.getElementById('card3d');
  setTimeout(() => {
    card.classList.add('loaded');
  }, 3000);

  // Interactive tilt on mouse move
  document.addEventListener('mousemove', (e) => {
    if (!card.classList.contains('loaded')) return;
    const rect = card.parentElement.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
  });

  document.addEventListener('mouseleave', () => {
    card.style.transform = '';
  });
</script>

</body>
</html>
