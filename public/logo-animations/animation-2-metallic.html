<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوآوران پنجره سپاهان — Metallic Forge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 650px;
    height: 650px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Radial pulse behind logo */
  .radial-pulse {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(155,33,48,0.15) 0%, transparent 70%);
    animation: pulse 3s 2s ease-in-out infinite;
    opacity: 0;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.3; }
    50% { transform: scale(1.15); opacity: 0.6; }
  }

  /* Main canvas for particle effect */
  canvas#sparks {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  /* Logo container */
  .logo-wrap {
    position: relative;
    z-index: 3;
    width: 420px;
    height: 420px;
  }

  svg.logo {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Outer ring */
  .ring-outer {
    fill: none;
    stroke: url(#metalGrad);
    stroke-width: 4;
    stroke-dasharray: 1508;
    stroke-dashoffset: 1508;
    animation: ringDraw 2s 0.5s ease-out forwards;
  }

  @keyframes ringDraw {
    to { stroke-dashoffset: 0; }
  }

  /* Inner ring */
  .ring-inner {
    fill: none;
    stroke: rgba(155,33,48,0.4);
    stroke-width: 1.5;
    stroke-dasharray: 1382;
    stroke-dashoffset: 1382;
    animation: ringDraw 1.5s 1s ease-out forwards;
  }

  /* Building shape */
  .building-shape {
    opacity: 0;
    animation: forgeIn 1.2s var(--delay) cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes forgeIn {
    0% {
      opacity: 0;
      transform: translateY(15px) scale(0.92);
      filter: brightness(3) blur(4px);
    }
    40% {
      filter: brightness(2) blur(1px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: brightness(1) blur(0);
    }
  }

  /* Shimmer effect on letters */
  .shimmer-text {
    opacity: 0;
    animation: shimmerIn 1s var(--delay) ease-out forwards;
  }

  @keyframes shimmerIn {
    0% { opacity: 0; filter: brightness(0.3); }
    50% { filter: brightness(2.5); }
    100% { opacity: 1; filter: brightness(1); }
  }

  /* Metallic text shine sweep */
  .shine-sweep {
    opacity: 0;
    animation: sweepIn 1.5s var(--delay) ease-out forwards;
  }

  @keyframes sweepIn {
    0% { opacity: 0; letter-spacing: 8px; }
    60% { opacity: 1; }
    100% { opacity: 1; letter-spacing: var(--ls, 2px); }
  }

  /* Ember glow on building */
  .ember-glow {
    animation: emberPulse 3s var(--delay) ease-in-out infinite;
  }

  @keyframes emberPulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(155,33,48,0.4)); }
    50% { filter: drop-shadow(0 0 18px rgba(155,33,48,0.9)); }
  }

  /* Bottom text bar */
  .bottom-bar {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 4;
  }

  .bottom-bar .url {
    color: rgba(254,254,254,0.35);
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0;
    animation: fadeUp 0.8s 4.5s ease-out forwards;
  }

  .bottom-bar .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #9B2130, transparent);
    opacity: 0;
    animation: fadeUp 0.8s 4.2s ease-out forwards;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Replay */
  .replay-btn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(155,33,48,0.15);
    border: 1px solid rgba(155,33,48,0.4);
    color: #9B2130;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
    z-index: 20;
    opacity: 0;
    animation: fadeUp 0.5s 5.5s ease-out forwards;
  }

  .replay-btn:hover {
    background: rgba(155,33,48,0.3);
    border-color: #9B2130;
  }

  .label-tag {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(155,33,48,0.4);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.5s 5s ease-out forwards;
  }
</style>
</head>
<body>

<div class="label-tag">METALLIC FORGE — ANIMATION 02</div>

<div class="stage">
  <div class="radial-pulse"></div>
  <canvas id="sparks" width="650" height="650"></canvas>

  <div class="logo-wrap">
    <svg class="logo" viewBox="0 0 500 500">
      <defs>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#9B2130"/>
          <stop offset="50%" style="stop-color:#FEFEFE"/>
          <stop offset="100%" style="stop-color:#9B2130"/>
        </linearGradient>
        <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#555"/>
          <stop offset="50%" style="stop-color:#ddd"/>
          <stop offset="100%" style="stop-color:#555"/>
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#9B2130"/>
          <stop offset="100%" style="stop-color:#282829"/>
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#96DAF8"/>
          <stop offset="100%" style="stop-color:#00AFEF"/>
        </linearGradient>
        <filter id="metalShine">
          <feSpecularLighting result="spec" specularExponent="25" lighting-color="#fff">
            <fePointLight x="250" y="100" z="200"/>
          </feSpecularLighting>
          <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"/>
        </filter>
      </defs>

      <!-- Outer circle -->
      <circle cx="250" cy="250" r="240" class="ring-outer" />
      <circle cx="250" cy="250" r="220" class="ring-inner" />

      <!-- Building body - Left -->
      <g class="building-shape ember-glow" style="--delay:1.8s">
        <polygon points="130,350 130,200 200,160 250,135 250,350"
          fill="url(#redGrad)" opacity="0.85"/>
      </g>

      <!-- Building body - Right -->
      <g class="building-shape ember-glow" style="--delay:2.0s">
        <polygon points="370,350 370,200 300,160 250,135 250,350"
          fill="url(#redGrad)" opacity="0.7"/>
      </g>

      <!-- Central window frame -->
      <g class="building-shape" style="--delay:2.3s">
        <rect x="225" y="210" width="50" height="110" rx="3" fill="#282829" stroke="#555" stroke-width="1.5"/>
        <rect x="230" y="215" width="40" height="100" rx="2" fill="url(#blueGrad)" opacity="0.7"/>
        <!-- Glass reflection -->
        <line x1="235" y1="220" x2="260" y2="280" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- Side windows -->
      <g class="building-shape" style="--delay:2.5s">
        <rect x="165" y="240" width="35" height="70" rx="2" fill="#282829" stroke="#555" stroke-width="1"/>
        <rect x="168" y="243" width="29" height="64" rx="1" fill="url(#blueGrad)" opacity="0.5"/>
      </g>
      <g class="building-shape" style="--delay:2.6s">
        <rect x="300" y="240" width="35" height="70" rx="2" fill="#282829" stroke="#555" stroke-width="1"/>
        <rect x="303" y="243" width="29" height="64" rx="1" fill="url(#blueGrad)" opacity="0.5"/>
      </g>

      <!-- Floor / base -->
      <g class="building-shape" style="--delay:2.7s">
        <rect x="120" y="345" width="260" height="8" rx="1" fill="url(#steelGrad)" opacity="0.6"/>
      </g>

      <!-- Roof peak structure -->
      <g class="building-shape" style="--delay:2.8s">
        <polygon points="250,100 120,190 135,190" fill="#9B2130" opacity="0.8"/>
        <polygon points="250,100 380,190 365,190" fill="#9B2130" opacity="0.6"/>
        <line x1="250" y1="100" x2="250" y2="130" stroke="#FEFEFE" stroke-width="2" opacity="0.5"/>
      </g>

      <!-- N letter -->
      <text x="165" y="390" font-size="32" font-weight="900" font-family="'Segoe UI', Arial"
        fill="url(#metalGrad)" class="shimmer-text" style="--delay:3.2s">N</text>

      <!-- P letter -->
      <text x="240" y="390" font-size="32" font-weight="900" font-family="'Segoe UI', Arial"
        fill="url(#steelGrad)" class="shimmer-text" style="--delay:3.4s">P</text>

      <!-- S letter -->
      <text x="310" y="390" font-size="32" font-weight="900" font-family="'Segoe UI', Arial"
        fill="url(#metalGrad)" class="shimmer-text" style="--delay:3.6s">S</text>

      <!-- Persian brand name -->
      <text x="250" y="75" text-anchor="middle" font-size="18"
        fill="#FEFEFE" font-family="Tahoma, Arial"
        class="shine-sweep" style="--delay:3.8s;--ls:1px">
        نوآوران پنجره سپاهان
      </text>

      <!-- English subtitle -->
      <text x="250" y="440" text-anchor="middle" font-size="11"
        fill="#9B2130" font-family="'Segoe UI', Arial" letter-spacing="3"
        class="shine-sweep" style="--delay:4.0s;--ls:3px">
        NOAVARAN PANJEREH SEPAHAN
      </text>

      <!-- Registration -->
      <text x="250" y="460" text-anchor="middle" font-size="8"
        fill="rgba(254,254,254,0.3)" font-family="Tahoma, Arial"
        class="shine-sweep" style="--delay:4.3s;--ls:1px">
        سهامی خاص — شماره ثبت: ۳۸۹۲
      </text>
    </svg>
  </div>

  <div class="bottom-bar">
    <div class="divider"></div>
    <div class="url">www.NoavaranPanjereh.com</div>
  </div>
</div>

<button class="replay-btn" onclick="location.reload()">↻ Replay Animation</button>

<script>
// Spark particles canvas animation
const canvas = document.getElementById('sparks');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const sparks = [];
const cx = W / 2, cy = H / 2;

class Spark {
  constructor() {
    this.reset();
  }
  reset() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 100 + Math.random() * 80;
    this.x = cx + Math.cos(angle) * radius;
    this.y = cy + Math.sin(angle) * radius;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -Math.random() * 2 - 0.5;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.015;
    this.size = Math.random() * 2 + 0.5;
    this.hue = Math.random() > 0.5 ? '155,33,48' : '0,175,239';
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.02;
    this.life -= this.decay;
    if (this.life <= 0) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.hue},${this.life * 0.7})`;
    ctx.fill();
  }
}

// Create sparks after delay
setTimeout(() => {
  for (let i = 0; i < 60; i++) {
    sparks.push(new Spark());
  }
  animate();
}, 1800);

function animate() {
  ctx.clearRect(0, 0, W, H);
  sparks.forEach(s => { s.update(); s.draw(); });
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
